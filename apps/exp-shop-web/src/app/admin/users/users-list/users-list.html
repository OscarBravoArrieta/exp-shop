<div class="content flex justify-content-center align-items-center" style="width: 100%; height: 100%; min-height: 100vh;">    
    @if (usersResource.isLoading()) {         
        <p-progress-spinner                  
             strokeWidth="8" 
             fill="transparent"                  
             animationDuration=".5s"                  
             aria-label="Loading"                 
             [style]="{ width: '50px', height: '50px' }"              
        />      
    } @else if (usersResource.error()) {         
        <p>Error al cargar usuarios: {{ usersResource.error() }}</p>     
    } @else {         
        <app-data-viewer-template
            style="width: 100%; height: 100%;"
            [dataSet]="usersResource.value()"                 
            [config]="config"                 
            [columnDefs]="colDefs()" 
        />     
    } 
</div>
