<p-card [style]="{ width: '18rem', overflow: 'hidden' }">
    <ng-template #header>
        <div class="relative">
            <img
                class="w-full max-h-42 object-cover"
                alt="user header"
                [src]="product()?.images?.[0]"
            />
            <p-avatar shape="circle" class="w-24! h-24! border-3 border-surface-0 dark:border-surface-900 absolute! -bottom-12! left-4!">
                <img src="https://images.unsplash.com/photo-1722495178488-c8056c4ec2c0?q=80&w=2081&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Sakura Fresh Market profile" />
            </p-avatar>
        </div>
    </ng-template>
    <ng-template #title>
        <span class="font-bold text-xl">{{product()?.title}}</span>
    </ng-template>
    <ng-template #subtitle>
        <div class="flex items-center gap-2">
            <p-tag severity="info" value="Daily" />
            <p-tag severity="info" value="Premium" />
        </div>
    </ng-template>
    <div class="space-y-4">
        <p>{{product()?.description}}</p>
        <div class="flex items-center gap-2">            
            <span><b>{{product()?.price | currency: 'EUR'}}</b> </span>
        </div>        
        <div class="flex items-center gap-2">
            <svg data-p-icon="star-fill" class="text-yellow-500"></svg>
            <span><b>4.6</b> (200+ reviews)</span>
        </div>

        <div class="flex items-center gap-2">
            <svg data-p-icon="map-marker"></svg>
            <span>Tokyo, Shibuya-ku</span>
        </div>
    </div>
    <ng-template #footer>
        <div class="flex items-center gap-2 mt-4">
            <!-- <button type="button" pButton severity="secondary" [outlined]="true" class="flex-1">
                <svg data-p-icon="phone"></svg>
                Call Us
            </button> -->
            <button type="button" pButton class="flex-1" (click)="addToCart()">
                
                <svg data-p-icon="shopping-cart" [size]="24"></svg>
                Agregar al carrito
            </button>
        </div>
    </ng-template>
</p-card>
