<div class="content flex justify-content-center align-items-center" style="width: 100%; height: 100%; min-height: 100vh;">     
    @if (productsResource.isLoading()) {
        <app-loading></app-loading>
    } @else if (productsResource.error()) {
        <p>Error al cargar productos: {{ productsResource.error() }}</p>
    } @else {
        <app-data-viewer-template
            style="width: 100%; height: 100%;"
            [dataSet]="productsResource.value()"
            [config]="config"
            [columnDefs]="colDefs()"
        />
    }
</div>
