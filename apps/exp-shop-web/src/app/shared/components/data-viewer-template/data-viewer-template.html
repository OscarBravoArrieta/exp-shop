<div class="content" style="width: 100%; height: 100%">
    <div class="flex justify-content-between flex-wrap">
        <div class="flex align-items-center justify-content-center w-4rem h-4rem bg-primary font-bold border-round m-2">1</div>
        <div class="flex align-items-center justify-content-center w-4rem h-4rem bg-primary font-bold border-round m-2">2</div>
        <div class="flex align-items-center justify-content-center w-4rem h-4rem">
            <div class="flex align-items-center justify-content-center">
                <button pButton>Nuevo</button>
            </div>
            <div class="flex align-items-center justify-content-center">
                <button pButton (click)="exportarA_CSV()">Exportar</button>
            </div>
        </div>
    </div>                
                   
    @defer (on immediate) {
        <ag-grid-angular
            style="width: 100%; height: 100%"
            [rowData]="dataSet()"
            [columnDefs]="columnDefs()"
            [defaultColDef]="defaultColDef" 
            style="width: 100%; height: 100%;"    
            [defaultColDef]="defaultColDef"
            [pagination]="true"
            (gridReady)="onGridReady($event)"
            [paginationPageSize]="10"/>
    } @placeholder {
        <div>Cargando tabla...</div>
    }
</div>
