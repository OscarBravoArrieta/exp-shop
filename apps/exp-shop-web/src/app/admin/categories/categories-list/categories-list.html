<div class="content flex justify-content-center align-items-center" style="width: 100%; height: 100%; min-height: 100vh;">
    @if (categoriesResource.isLoading()) {
        <app-loading></app-loading>
    } @else if (categoriesResource.error()) {
        <p>Error al cargar categorías: {{ categoriesResource.error() }}</p>
    } @else {
        <app-data-viewer-template
            style="width: 100%; height: 100%;"
            [dataSet]="categoriesResource.value()"
            [config]="config"
            [columnDefs]="colDefs()"
        />

    }
</div>
